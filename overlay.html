<!doctype html><meta charset=utf-8><title>BSCast overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel=stylesheet><link rel=stylesheet href=style.css?v=7>
<body class=ov><div id=o></div><div id=hk hidden><b>Atalhos (F2 fecha)</b><div id=ky></div><small>Clique no campo e aperte a tecla. Shift + tecla desfaz.</small></div>
<script src=config.js?v=7></script><script src=common.js?v=7></script><script>
// Use como Fonte de navegador do OBS: o fundo é realmente transparente. ?preview=1 = janela de prévia (cor sólida; &bg=ff00ff muda a cor). ?only=draft|match. F2 = atalhos.
const Q=new URLSearchParams(location.search),PV=Q.get('preview');
if(PV)document.documentElement.style.background='#'+(Q.get('bg')||'12151f');
const fit=()=>{const z=PV?innerWidth/1920:1;document.body.style.zoom=z;document.body.style.height=(PV?innerHeight/z:1080)+'px'};fit();onresize=fit;
const im=(k,c)=>ICONS[k]?`<img class="${c}" src="${ICONS[k]}" alt="">`:'';
const gp=(k,c)=>c?`<div class=bg>${im(k,'bi')}<div class=bs>${c}</div></div>`:'';
const hide=`onerror="this.parentNode.style.display='none'"`;
const BRAND=`<div class=brand><img src=assets/brand-icon.png alt="" ${hide}><svg viewBox="0 0 10 10"><path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg><img src=assets/brand-bs.png alt="" ${hide}></div>`;
function draw(s){window.ST=s;const ph=s.ph,only=Q.get('only');
 if(!s.tm||(ph!='draft'&&ph!='match')||(only&&only!=ph)){o.innerHTML='';return}
 const d=ph=='draft',m=s.mp[s.cur]||{},tn=s.type=='torneio';if(!tn)s.gb=false;
 const x=[side(s,0,d),side(s,1,d)],cl=tn?(s.ch.l||ICONS.default):ICONS.scrim;
 document.body.className='ov '+(d?'dr':'mt');
 const P=t=>`<span class="pip t${t}">${[0,1].map(k=>`<i class="${s.rd[t]>k?'on':''}"></i>`).join('')}</span>`;
 const coin=t=>s.first==t?im(t?'last':'first','coin'):'';
 const H=t=>{const g=gp('gban',x[t].gb),b=gp('ban',x[t].bn),p=`<div class=pg>${coin(t)}${x[t].pk}</div>`,k=`<div class=stk>${g}${b}</div>`;
  return d?`<div class="pnl t${t}"><div class=ph>${t?`<span>${x[t].nm}</span>${x[t].lg}`:`${x[t].lg}<span>${x[t].nm}</span>`}</div><div class="hf t${t}">${t?p+k:k+p}</div></div>`
  :`<div class="hf t${t}">${t?[p,b,g].join(''):[g,b,p].join('')}</div>`};
 o.innerHTML=d?`<div class=dv2>${H(0)}<div class=cn><div class=sc2><b>${s.sc[0]}</b><img class=vs src=assets/vs.png alt="VS"><b>${s.sc[1]}</b></div>
 <div class=mrow>${m.mi?`<img src="${m.mi}" alt="">`:''}<b>${h(m.mo)}</b></div><span class=mp>${h(m.mn)}</span>
 <div class=crow>${cl?`<img src="${cl}" alt="">`:''}<span>${tn?h(s.ch.n):'Scrim'}</span></div><small>${tn?'Jogo '+(s.cur+1)+(s.ch.ph?' · '+h(s.ch.ph):''):''}</small></div>${H(1)}</div>`
 :`<div class=mv><div class=bt><div class="tm t0">${x[0].lg}<span>${x[0].nm}</span><b>${s.sc[0]}</b></div><div class=md>${m.mi?`<img src="${m.mi}" alt="">`:''}<small>${h(m.mn)}${tn&&s.ch.ph?' · '+h(s.ch.ph):''}</small><div class=pips>${P(0)}${P(1)}</div></div><div class="tm t1"><b>${s.sc[1]}</b><span>${x[1].nm}</span>${x[1].lg}</div></div><div class=sub>${H(0)}${BRAND}${H(1)}</div></div>
 <div class=cbox>${cl?`<img src="${cl}" alt="">`:''}</div>
 <div class=rbox><b>SET ${s.sc[0]+s.sc[1]+1} · ROUND ${s.rd[0]+s.rd[1]+1}</b><div class=rl><div class="tl t0"><img src="${s.tm[0].l}" alt="">${P(0)}</div><i>X</i><div class="tl t1"><img src="${s.tm[1].l}" alt="">${P(1)}</div></div></div>`}
resolveIcons().then(loadBr).then(()=>sync(draw));
onkeydown=e=>{if(e.key=='F2'){e.preventDefault();hk.hidden=!hk.hidden;keysUI(ky);return}
 hot(e,(a,d)=>{let s;try{s=JSON.parse(localStorage.bscast_state)}catch{return}if(!s.tm)return;act(s,a,d);push(s);draw(s)})};
</script>
