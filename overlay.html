<!doctype html><meta charset=utf-8><title>BSCast overlay</title><link rel=stylesheet href=style.css?v=4>
<body class=ov><div id=o></div><div id=hk hidden><b>Atalhos (F2 fecha)</b><div id=ky></div><small>Clique no campo e aperte a tecla. Shift + tecla desfaz.</small></div>
<script src=common.js?v=4></script><script>
// ?bg=green → fundo chroma key (captura de janela). ?only=draft|match → mostra só uma fase. F2 = editar atalhos.
const Q=new URLSearchParams(location.search);
if(Q.get('bg')=='green')document.documentElement.style.background='#00ff00';
const fit=()=>document.body.style.zoom=Q.get('bg')?innerWidth/1920:1;fit();onresize=fit;
const gp=(t,l,c,g)=>c?`<div class="bg ${g?'g':''}"><small>${l}</small><div class="bs t${t}">${c}</div></div>`:'';
function draw(s){const ph=s.ph,only=Q.get('only');
 if(!s.tm||(ph!='draft'&&ph!='match')||(only&&only!=ph)){o.innerHTML='';return}
 const d=ph=='draft',m=s.mp[s.cur]||{},tn=s.type=='torneio',x=[side(s,0,d),side(s,1,d)],ch=tn&&s.ch.l?`<img class=ch src="${s.ch.l}" alt="">`:'';
 document.body.className='ov '+(d?'dr':'mt');
 const P=t=>`<span class="pip t${t}">${[0,1].map(k=>`<i class="${s.rd[t]>k?'on':''}"></i>`).join('')}</span>`;
 o.innerHTML=d?`<div class=pn><div class=top><div class="pg t0">${x[0].pk}</div>${gp(0,'BANS',x[0].bn)}${gp(0,'BANS GLOBAIS',x[0].gb,1)}
 <div class=ct>${m.mi?`<img class=mi src="${m.mi}" alt="">`:''}<b>${h(m.mo)}</b><small>${h(m.mn)}${tn?' · Jogo '+(s.cur+1):''}</small>${ch}</div>
 ${gp(1,'BANS GLOBAIS',x[1].gb,1)}${gp(1,'BANS',x[1].bn)}<div class="pg t1">${x[1].pk}</div></div>
 <div class=bt><div class="tm t0">${x[0].lg}<span>${x[0].nm}</span></div><div class=sc><b>${s.sc[0]}</b><i>VS</i><b>${s.sc[1]}</b></div><div class="tm t1"><span>${x[1].nm}</span>${x[1].lg}</div></div></div>`
 :`<div class=pn><div class=bt><div class="tm t0">${x[0].lg}<span>${x[0].nm}</span><b>${s.sc[0]}</b></div><div class=md>${m.mi?`<img src="${m.mi}" alt="">`:''}<small>${h(m.mn)}</small><div class=pips>${P(0)}${P(1)}</div></div><div class="tm t1"><b>${s.sc[1]}</b><span>${x[1].nm}</span>${x[1].lg}</div></div>
 <div class=sub>${[0,1].map(t=>`<div class="sd t${t}"><div class="pg t${t}">${x[t].pk}</div>${gp(t,'BANS',x[t].bn)}${gp(t,'GLOBAL',x[t].gb,1)}</div>`).join('')}</div></div>`}
loadBr().then(()=>sync(draw));
onkeydown=e=>{if(e.key=='F2'){e.preventDefault();hk.hidden=!hk.hidden;keysUI(ky);return}
 hot(e,(a,d)=>{let s;try{s=JSON.parse(localStorage.bscast_state)}catch{return}if(!s.tm)return;act(s,a,d);push(s);draw(s)})};
</script>
