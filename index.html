<!doctype html><meta charset=utf-8><title>BSCast</title><link rel=stylesheet href=style.css>
<body class=ctl><header><img src=assets/logo1.png height=40 alt=""><h1>BSCast</h1><span id=ap>carregando dados…</span><button onclick="openOv()">Abrir tela secundária (overlay)</button></header>
<div id=st></div><div id=app></div>
<script src=common.js></script><script>
const NM=['Tipo','Campeonato','Times','Mapas','Regras','Draft e transmissão'];
let S={type:'torneio',bo:3,ch:{n:'',l:'assets/logo1.png'},tm:[{n:'Time Azul',l:'assets/logo1.png',p:['','','']},{n:'Time Vermelho',l:'assets/logo2.png',p:['','','']}],mp:[],cur:0,first:0,gb:false,sl:{},sc:[0,0],rd:[0,0],ph:'setup'},MAPS=[],step=0,A='',Q='',MQ='',MS=0,MD='',ready=0;
const $=i=>document.getElementById(i),save=()=>push(S),tn=()=>S.type=='torneio',e=s=>String(s).replace(/"/g,'&quot;');
const PRI=['Gem Grab','Brawl Ball','Bounty','Heist','Hot Zone','Knockout'];
function up(i,cb){const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const k=256/Math.max(m.width,m.height,256),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;c.getContext('2d').drawImage(m,0,0,c.width,c.height);cb(c.toDataURL('image/png'));save();R()};m.src=r.result};r.readAsDataURL(i.files[0])}
const pv=()=>`<div class=pv><div class=t0><img src="${e(S.tm[0].l)}" alt=""><span>${h(S.tm[0].n)}</span></div><i>VS</i><div class=t1><span>${h(S.tm[1].n)}</span><img src="${e(S.tm[1].l)}" alt=""></div></div>`;
const nx=d=>{step+=d;if(!tn()&&step==1)step+=d;if(step==5&&d>0){S.ph='draft';save()}R()};
const nav=()=>`<div class=nav>${step?`<button class=sec onclick="nx(-1)">← Voltar</button>`:'<span></span>'}<button onclick="nx(1)">${step==4?'Iniciar draft →':'Avançar →'}</button></div>`;
const sel=(k,v,l)=>`<button class="${S[k]===v?'on':''}" onclick="S.${k}=${typeof v=='string'?`'${v}'`:v};${k=='type'?`if(!tn())S.bo=3;`:''}save();R()">${l}</button>`;
function R(){const n=S.mp.length,want=tn()?S.bo:1;while(S.mp.length<want)S.mp.push({});S.mp.length=want;if(S.cur>=want)S.cur=0;if(MS>=want)MS=0;
 $('st').innerHTML=NM.map((x,i)=>tn()||i!=1?`<b class="${i==step?'on':i<step?'ok':''}" onclick="step=${i};R()">${i+1}. ${x}</b>`:'').join('');
 const T=t=>`<div><b>${t?'Vermelho':'Azul'}</b><input value="${e(S.tm[t].n)}" placeholder="Nome do time" oninput="S.tm[${t}].n=this.value;$('pv').innerHTML=pv();save()"><input type=file accept=image/* onchange="up(this,d=>S.tm[${t}].l=d)">${[0,1,2].map(k=>`<input value="${e(S.tm[t].p[k])}" placeholder="Player ${k+1}" oninput="S.tm[${t}].p[${k}]=this.value;save()">`).join('')}</div>`;
 const pg=[
 `<h2>Tipo de partida</h2><div class=opts>${sel('type','torneio','Torneio')}${sel('type','scrim','Scrim')}</div>${tn()?`<h2>Formato da série</h2><div class=opts>${[3,5,7].map(v=>sel('bo',v,'Md'+v)).join('')}</div>`:''}${nav()}`,
 `<h2>Campeonato</h2><div class=cols><div><input value="${e(S.ch.n)}" placeholder="Nome do campeonato" oninput="S.ch.n=this.value;save()"><input type=file accept=image/* onchange="up(this,d=>S.ch.l=d)"></div><img src="${e(S.ch.l)}" height=90 alt=""></div>${nav()}`,
 `<h2>Times e players</h2><div class=cols>${T(0)}${T(1)}</div><div id=pv>${pv()}</div>${nav()}`,
 `<h2>Mapas${tn()?' (ordem da série)':''}</h2><div class=slots style="gap:10px">${S.mp.map((m,i)=>`<div class="sl ${MS==i?'on':''}" onclick="MS=${i};MD=S.mp[${i}].mo||MD;R()">${m.mi?`<img src="${e(m.mi)}" alt=""> `:''}<b>Mapa ${i+1}</b><br>${h(m.mo||'—')}<br><small>${h(m.mn||'escolha abaixo')}</small></div>`).join('')}</div>
 ${tn()?`<label>Primeiro mapa jogado: <select onchange="S.cur=+this.value;save()">${S.mp.map((_,i)=>`<option value=${i} ${S.cur==i?'selected':''}>Mapa ${i+1}</option>`)}</select></label>`:''}
 <h2 style="margin-top:12px">Modo</h2><div class=grid style="max-height:190px" id=md></div><h2 style="margin-top:12px">Mapa</h2><input placeholder="Buscar mapa" value="${e(MQ)}" oninput="MQ=this.value;mg()"><div class=grid id=mg></div>${nav()}`,
 `<h2>Quem começa o draft?</h2><div class=opts>${sel('first',0,'Azul (picks 1, 4, 5)')}${sel('first',1,'Vermelho (picks 1, 4, 5)')}</div>${tn()?`<h2>Bans globais (2 por time, valem para toda a série)</h2><div class=opts>${sel('gb',true,'Sim')}${sel('gb',false,'Não')}</div>`:''}${nav()}`,
 live()][step];
 $('app').innerHTML=`<section>${pg}</section>`;if(step==3){md();mg()}if(step==5)gr()}
function md(){const m=[...new Map(MAPS.map(x=>[x.mode,x.mimg]))].sort((a,b)=>(PRI.indexOf(a[0])+1||99)-(PRI.indexOf(b[0])+1||99));if(!MD&&m[0])MD=m[0][0];
 $('md').innerHTML=m.map(([n,i])=>`<div class="card ${MD==n?'on':''}" onclick="MD='${n.replace(/'/g,"\\'")}';md();mg()"><img src="${e(i)}" alt="">${h(n)}</div>`).join('')}
function mg(){const m=S.mp[MS]||{};$('mg').innerHTML=MAPS.filter(x=>x.mode==MD&&x.name.toLowerCase().includes(MQ.toLowerCase())).map(x=>`<div class="card mp ${m.mn==x.name&&m.mo==MD?'on':''}" onclick="pm(${x.id})"><img src="${e(x.img)}" alt="" loading=lazy>${h(x.name)}</div>`).join('')}
function pm(id){const x=MAPS.find(y=>y.id==id);S.mp[MS]={mo:x.mode,mn:x.name,mi:x.mimg,mm:x.img};MS=Math.min(MS+1,S.mp.length-1);save();R()}
const keys=()=>[...(S.gb?['g0_0','g0_1','g1_0','g1_1']:[]),...[0,1,2].flatMap(k=>[`b0_${k}`,`b1_${k}`]),...[0,1,2,3,4,5].map(i=>'p'+i)];
function live(){const f=a=>a.map(k=>`<div class="${A==k?'on':''}" onclick="A='${k}';R()" oncontextmenu="delete S.sl['${k}'];A='${k}';save();R();return false">${cell(S.sl[k],'t'+(k[0]=='p'?OWN(S.first)[+k[1]]:k[1]))}</div>`).join('');
 const k=keys();return `<h2>Draft <small style="font-weight:400;color:var(--g)">(clique no slot e depois no brawler; botão direito limpa)</small></h2>
 ${S.gb?`Bans globais (azul | vermelho)<div class=slots>${f(k.filter(x=>x[0]=='g'))}</div>`:''}Bans (azul/vermelho alternados)<div class=slots>${f(k.filter(x=>x[0]=='b'))}</div>Picks (ordem 1→6)<div class=slots>${f(k.filter(x=>x[0]=='p'))}</div>
 <input placeholder="Buscar brawler" value="${e(Q)}" oninput="Q=this.value;gr()"><div class=grid id=gr></div>
 <h2 style="margin-top:16px">Transmissão</h2><p>Fase: <b>${S.ph=='draft'?'Draft':'Partida'}</b> · Jogo ${S.cur+1}${tn()?' de '+S.mp.length:''} · Placar geral <b>${S.sc.join(' x ')}</b> · Sets <b>${S.rd.join(' x ')}</b>${tn()&&Math.max(...S.sc)>=Math.ceil(S.bo/2)?' · <b style="color:var(--y)">Série decidida</b>':''}</p>
 <div class=opts><button onclick="K('n')">Draft ⇄ Partida [N]</button><button onclick="K('a')">+Set Azul [A]</button><button onclick="K('s')">+Set Vermelho [S]</button><button onclick="K('q')">Ajustar jogo Azul [Q]</button><button onclick="K('w')">Ajustar jogo Verm. [W]</button><button onclick="K('g')">Próximo jogo [G]</button></div>
 <p style="color:var(--g)">Quem fizer 2 sets ganha o game (+1 no placar geral). Shift + tecla desfaz. Jogo Q/W é ajuste manual.</p><div class=nav><button class=sec onclick="step=4;R()">← Configuração</button><span></span></div>`}
function gr(){const u=Object.values(S.sl);$('gr').innerHTML=BRL.filter(b=>b.name.toLowerCase().includes(Q.toLowerCase())).map(b=>`<div class="card ${u.includes(b.id)?'off':''}" onclick="pk(${b.id})"><img src="${e(b.img)}" alt="">${h(b.name)}</div>`).join('')||'<p>Nenhum brawler carregado.</p>'}
function pk(id){const k=keys();if(!A)A=k.find(x=>!S.sl[x])||'';if(!A)return;S.sl[A]=id;A=k.find(x=>!S.sl[x])||'';save();R()}
function K(k,d=1){const s=S;
 if(k=='n'&&s.ph!='setup')s.ph=s.ph=='draft'?'match':'draft';
 if(k=='q'||k=='w'){const t=k=='q'?0:1;s.sc[t]=Math.max(0,s.sc[t]+d)}
 if(k=='a'||k=='s'){const t=k=='a'?0:1,w=s.rd[t];if(d>0&&w>=2)return;s.rd[t]=Math.max(0,w+d);if(d>0&&w==1)s.sc[t]++;if(d<0&&w==2)s.sc[t]--}
 if(k=='g'&&d>0){s.cur=Math.min(s.cur+1,s.mp.length-1);s.first=1-s.first;s.sl=Object.fromEntries(Object.entries(s.sl).filter(([x])=>x[0]=='g'));s.rd=[0,0];s.ph='draft';A=''}
 save();R()}
onkeydown=ev=>{if(step!=5||/input|select/i.test(ev.target.tagName))return;K(ev.key.toLowerCase(),ev.shiftKey?-1:1)};
function openOv(){open('overlay.html?bg=green','bscast_overlay','width=1280,height=720')}
Promise.all([loadBr(),loadMaps()]).then(([b,m])=>{MAPS=m;const a=$('ap');a.textContent=b.length&&m.length?`API ok: ${b.length} brawlers, ${m.length} mapas`:'Falha ao carregar a API (veja o console do navegador)';if(!b.length||!m.length)a.className='er';
 sync(s=>{if(ready)return;ready=1;if(s.tm){S=s;if(S.ph!='setup')step=5}R()})});
</script>
